<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그래프 블라인드 결정 · 학생</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">f′</div><div><b>그래프를 보지 않고 결정할 수 있을까?</b><span id="who">학생 화면</span></div></div>
    <div class="row"><span id="mode"></span><a class="btn sm" id="exit" href="index.html">나가기</a></div>
  </div>
  <div class="steps" id="steps"></div>
  <div id="app"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="api.js"></script>
<script>
/* ---------- 상태 ---------- */
const Q=new URLSearchParams(location.search);
const DEMO=Q.get('demo')==='1';
let G=+(Q.get('g')||0);try{if(!G)G=JSON.parse(localStorage.getItem('gbd-login')||'{}').group||1;}catch(e){G=G||1;}
const P=partnerOf(G),N=ROUND;
const KEY=DEMO?'gbd-st-demo':`gbd-st-${CLASS}-${G}`;
const fresh=c=>({case:c,stage:'analyze',deg:null,co:['','','','',''],coOk:false,coTry:0,coNote:'',rt:['','',''],rtOk:false,rtTry:0,sent:[],reasons:{},recon:{strokes:[],sketched:false,sketchUrl:'',out:[],cand:null,extra:null,openExtra:false,ans:{a:'',b:''},why:''},reconRes:null});
let L=null;try{L=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
if(!L||!L.recon||!('strokes' in L.recon))L=DEMO?fresh('demo'):{stage:'setup',case:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(L));}catch(e){}};
let partnerRow=null,myRow=null,poll=null,cur=null;
const myCase=()=>DEMO?REQ[0]:caseById(L.case);
const theirCase=()=>DEMO?REQ[0]:caseById(partnerRow&&partnerRow.case_id);
const ME=DEMO?'교사':`${G}모둠`, YOU=DEMO?'해결팀':`${P}모둠`, SENDER=DEMO?'교사':YOU;
const bat=w=>jo(w)==='이에요',IGA=w=>w+(bat(w)?'이':'가'),EUN=w=>w+(bat(w)?'은':'는');
if(DEMO){$('exit').href='teacher.html';$('exit').textContent='교사 화면으로';}
$('mode').innerHTML=DEMO?'<span class="badge demo">교사 시범 · 저장하지 않음</span>':modeBadge();
$('who').textContent=DEMO?'교사 시범 (교사가 풀이팀과 해결팀을 모두 해요)':`${G}모둠 · 짝 모둠 ${P}모둠`;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
async function push(fields){if(DEMO)return;try{await api.upsertRound(fields);}catch(e){toast('저장하지 못했어요: '+(e.message||e));}}
const mine=f=>push({round_no:N,analyst_group:G,recon_group:P,case_id:L.case,...f});
const theirs=f=>{const cid=(partnerRow&&partnerRow.case_id)||(theirCase()||{}).id;return push({round_no:N,analyst_group:P,recon_group:G,case_id:cid,...f});};

/* ---------- 화면 ---------- */
const STEPS=[['analyze','① 풀이'],['pick','② 단서 보내기'],['recon','③ 해결'],['result','④ 결과']];
function steps(){const map={analyze:1,pick:2,wait:3,recon:3,result:4};
  $('steps').innerHTML=L.stage==='setup'?'':STEPS.map(([k,t],j)=>`<span class="step ${map[L.stage]===j+1?'on':map[L.stage]>j+1?'done':''}">${t}</span>`).join('');}
let partnerCase=null;
function vSetup(){const list=REQ.filter(r=>r.id!=='demo');
  return `<section class="panel"><p class="eyebrow">문제 고르기</p><h2>${G}모둠 · 해결할 문제를 하나 고르세요</h2>
  <p class="small muted" style="margin:0 0 10px"><b>짝 모둠(${P}모둠)과는 서로 다른 문제를 골라요.</b> 다른 모둠과는 같아도 괜찮아요. 우리 모둠이 분석한 결과를 단서로 만들어 ${P}모둠에게 보내고, ${P}모둠은 그 단서만 보고 개형을 그려 결정해요.</p>
  ${Object.entries(TYPES).map(([k,t])=>`<h3 style="margin:14px 0 6px">${t}</h3><div class="grid2">${list.filter(r=>r.kind===k).map(r=>`<button class="req" data-case="${r.id}" aria-pressed="${L.case===r.id}" ${partnerCase===r.id?'disabled style="opacity:.45"':''}><span class="who">${r.num?'문제 '+r.num:'시범 문제'}${partnerCase===r.id?' · 짝 모둠이 고른 문제':''}</span><b>${esc(DATA[r.data].name)}</b><span>${esc(r.text)}</span></button>`).join('')}</div>`).join('')}
  <div class="box yel sec"><b>순서</b> <span class="small">① 문장을 복사해 ChatGPT로 식 만들기 → 활동지에 미분과 증감표 → ② 단서 1~3개와 이유 보내기 → ③ ${P}모둠이 보낸 단서로 개형을 그리고 결정 → ④ 결과 확인</span></div>
  <button class="btn navy big" id="start" style="margin-top:12px" ${L.case?'':'disabled'}>${L.case?`문제 ${caseById(L.case).num} 풀이 시작`:'문제를 먼저 고르세요'}</button></section>`;}
const LET=['a','b','c','d','e'];
function aiPrompt(r,deg){const d=DATA[r.data],n=deg+1;const form=deg===3?'f(x) = ax³ + bx² + cx + d':'f(x) = ax⁴ + bx³ + cx² + dx + e';
  return `다음은 ${d.place} 데이터야. (가상 데이터)\nx는 ${d.cen}시를 0으로 놓은 시간이야. (x = 0이 ${d.cen}시, x = 1이 ${d.cen+1}시)\n${r.xs.map((h,i)=>`x = ${h-d.cen}일 때 ${r.ys[i]}${d.unit}`).join(', ')}\nx에 대한 ${deg===3?'삼차함수':'사차함수'} ${form} 로 근사해 줘. 계수 ${LET.slice(0,n).join(', ')}를 알려 줘.`;}
function vAnalyze(){const r=myCase(),d=DATA[r.data],deg=L.deg,n=deg?deg+1:0,rts=rtList(d),Lx=r.dom[1]-r.dom[0];
  return `<section class="panel"><div class="kicker" style="justify-content:space-between"><span>① ${ME} 풀이팀</span><b class="small muted">이 데이터는 ${YOU}에게 보이지 않아요</b>${DEMO?'':'<button class="btn sm" id="backSetup">← 문제 다시 고르기</button>'}</div>
  <div class="grid2"><div class="box"><span class="small" style="color:var(--an);font-weight:700">${r.num?'문제 '+r.num:'시범 문제'}</span><br><b>${esc(d.name)}</b><p class="small" style="margin:4px 0 0">${esc(r.text)}</p></div>
   <div class="box"><span class="small muted">${esc(d.name)} (실제 경향을 바탕으로 만든 가상 데이터) · x는 ${d.cen}시를 0으로 놓은 시간 (x = 0이 ${d.cen}시, x = 1이 ${d.cen+1}시)</span><div class="tscroll" style="margin-top:6px"><table><tr><th>시각</th>${r.xs.map(h=>`<th>${h}시</th>`).join('')}</tr><tr><th>x</th>${r.xs.map(h=>`<td>${h-d.cen}</td>`).join('')}</tr><tr><th>${esc(d.unit)}</th>${r.ys.map(y=>`<td>${y}</td>`).join('')}</tr></table></div></div></div>
  ${ws('m','문제를 수학의 말로','x는 12시를 0으로 놓은 시간이에요. (x = 0이 12시, x = 4가 16시, x = 6이 18시)<br>그래서 정의역은 0 ≤ x ≤ 6<br>가장 많은 때 → 닫힌구간 [0, 6]에서 f(x)가 최댓값을 갖는 x')}
  <div class="sec"><div class="box"><h3>AI 활용 · 데이터를 식으로 바꾸기</h3>
    <p class="small" style="margin:0 0 6px"><b>1. 표를 보고 차수 정하기</b> · 먼저 활동지에 개형을 예상해요. 늘다가 줄거나 줄다가 느는 방향이 몇 번 바뀌나요? 1~2번 바뀌면 삼차함수, 3번 바뀌면 사차함수로 해 보세요.</p>
    <div class="row"><button class="btn sm" data-deg="3" aria-pressed="${deg===3}" style="${deg===3?'background:var(--navy);color:var(--navy-ink)':''}">삼차함수</button><button class="btn sm" data-deg="4" aria-pressed="${deg===4}" style="${deg===4?'background:var(--navy);color:var(--navy-ink)':''}">사차함수</button></div>
    ${ws('deg','차수 정하기','33 → 80 → 121 → 150 → 161로 늘다가 148 → 105로 줄어요.<br>방향이 1번 바뀌었으니 <b>삼차함수</b>로 해요.')}
    ${deg?`<p class="small" style="margin:12px 0 6px"><b>2. 아래 문장을 복사해 ChatGPT 앱에 붙여 넣기</b> · 받은 계수를 들고 이 화면으로 돌아와요.</p>
    <div class="prompt" id="pr">${esc(aiPrompt(r,deg))}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="cp">문장 복사</button><span class="small muted" id="cpm"></span></div>
    <p class="small" style="margin:12px 0 6px"><b>3. ChatGPT가 알려 준 계수 넣기</b></p>
    <div class="row">${LET.slice(0,n).map((k,i)=>`<label class="small">${k} = <input class="co" type="text" inputmode="decimal" id="co${i}" value="${esc(L.co[i]||'')}" aria-label="계수 ${k}"></label>`).join('')}<button class="btn sm navy" id="coChk">AI 식 확인</button></div>
    ${L.coTry&&!L.coOk?'<p class="warn" style="margin:10px 0 0">데이터와 맞지 않아요. 계수를 그대로 옮겼는지 확인하세요. 계속 맞지 않으면 표를 다시 보고 차수를 다시 생각해 보세요.</p>':''}
    ${L.coOk?`<p class="ok" style="margin:10px 0 0">데이터와 맞아요.${L.coNote?' '+L.coNote:''} 활동지에 식을 쓰고, x에 1을 넣어 표의 값(${r.ys[1]})과 같은지 직접 확인해 보세요.</p>${ws('chk','AI 식 직접 확인','f(x) = −x³ + 48x + 33<br>f(1) = −1 + 48 + 33 = 80 → 표의 값 80과 같아요.')}`:''}`:''}</div>
  ${L.coOk?`<div class="box"><h3>활동지에 직접 미분하기</h3><div class="eq">${esc(fmtPoly(d.co))}</div>
    <p class="small muted" style="margin:8px 0">정의역 0 ≤ x ≤ ${Lx} (${r.dom[0]}시 ~ ${r.dom[1]}시) · 활동지에 ① f′(x) → ② 인수분해 → ③ f′(x)=0인 x → ④ 정의역 밖의 해 지우기 → ⑤ 증감표 → ⑥ 개형</p>
    <div class="row">${rts.map((_,i)=>`<label class="small">x = <input class="co" type="text" inputmode="numeric" id="r${i}" value="${esc(L.rt[i]||'')}" aria-label="${i+1}번째 해"></label>`).join('')}<button class="btn sm navy" id="rtChk">해 확인</button></div>
    ${L.rtTry&&!L.rtOk?'<p class="warn" style="margin:10px 0 0">다시 확인해 보세요. 각 항에 차수를 곱하고 차수를 하나 내렸나요? 정의역 밖의 해도 모두 넣어요.</p>':''}
    ${L.rtOk?`<p class="ok" style="margin:10px 0 0">맞아요! f′(x)=0인 x = ${rts.join(', ')}. ${rts.filter(t=>t<0||t>Lx).length?`정의역 밖의 해 x = ${rts.filter(t=>t<0||t>Lx).join(', ')}는 지워요. `:''}${rts.filter(t=>t>=0&&t<=Lx).map(t=>`x = ${t} → ${tl(t+d.cen)}`).join(', ')}. 증감표와 개형을 완성하세요.</p>`:''}
    ${ws('d','직접 미분과 인수분해','f′(x) = −3x² + 48 = −3(x² − 16) = −3(x − 4)(x + 4)<br>f′(x) = 0 → x = −4, 4<br>x = −4는 정의역 0 ≤ x ≤ 6 밖이라 지워요. · x = 4 → 12시 + 4시간 = <b>16시</b>')}
    ${L.rtOk?ws('t','증감표',DEMOTBL)+ws('g','그래프 개형',`<div class="gbox">${svgGraph(r,{curves:[{fn:x=>poly(d.co,x-d.cen),col:'var(--good)'}],yb:bounds(r,[x=>poly(d.co,x-d.cen)]),yl:true,points:true,vlines:[{x:16,col:'var(--bad)',dash:true,t:'16시 극대 161명'}],w:720,h:230,aria:'그래프 개형'})}</div>12시부터 16시까지 증가, 16시에 극대 161명, 16시부터 18시까지 감소`):''}</div>
  <button class="btn navy big" id="toPick" ${L.rtOk?'':'disabled'}>보낼 단서 고르기</button>`:''}</div></section>`;}
/* ---------- 교사 시범: 활동지에 쓰는 풀이를 화면에 보여 주기 ---------- */
function ws(k,t,html){if(!DEMO)return '';const o=(L.ws||{})[k];
  return `<div class="box" style="margin-top:10px;border:2px dashed var(--an);background:#FFFBEA"><div class="row" style="justify-content:space-between;align-items:center"><b class="small" style="color:var(--an)">활동지 풀이 · ${t}</b><button class="btn sm" data-ws="${k}">${o?'가리기':'보여 주기'}</button></div>${o?`<div style="margin-top:8px;line-height:1.7">${html}</div>`:''}</div>`;}
const DEMOTBL=`<table><tr><th>x</th><td>0</td><td>…</td><td>4</td><td>…</td><td>6</td></tr><tr><th>f′(x)</th><td></td><td>+</td><td>0</td><td>−</td><td></td></tr><tr><th>f(x)</th><td>33</td><td>↗</td><td>161 (극대)</td><td>↘</td><td>105</td></tr></table>`;
const DEMO_WHY='최댓값을 정하려면 극댓값과 양 끝값을 비교해야 해요. 이 단서로 극댓값이 16시 161명이고, 양 끝값 33명, 105명보다 크다는 것을 알 수 있어요.';
const DEMO_GROUND='16시까지 늘다가 줄어들고, 16시의 극댓값 161명이 양 끝값 12시 33명, 18시 105명보다 크므로 16시에 가장 많아요.';
function demoDel(r){const C=candidates(r),fx={alt0:'극대가 14시라서 "16시에 극댓값" 단서와 달라요.',alt1:'18시까지 계속 늘어나서 극대가 없어요.',alt2:'16시 값이 110명이라서 "극댓값 161명" 단서와 달라요.'};
  return C.map(c=>c.ans?`<b>${c.label} ○</b> 16시에 극댓값 161명 → 단서와 맞아요. 남겨요.`:`<b>${c.label} ✕</b> ${fx[c.id]}`).join('<br>');}
function myShape(r){const d=DATA[r.data],fn=x=>poly(d.co,x-d.cen),F=feat(r,fn),u=d.unit,v=y=>Math.round(y);
  const yb=bounds(r,[fn]),vl=F.ext.map(e=>({x:e.x,col:e.type==='max'?'var(--bad)':'var(--an)',dash:true,t:`${tl(e.x)} ${e.type==='max'?'극대':'극소'} ${v(e.v)}${u}`}));
  const flow=[];F.ivs.forEach((iv,i)=>{flow.push(`${tl(iv.l)}~${tl(iv.r)} ${iv.up?'증가':'감소'}`);const e=F.ext[i];if(e)flow.push(`<b>${tl(e.x)} ${e.type==='max'?'극대':'극소'} ${v(e.v)}${u}</b>`);});
  return `<div class="box sec" style="margin-bottom:12px"><h3 style="margin:0 0 4px">우리가 알아낸 개형</h3><p class="small muted" style="margin:0 0 8px">${YOU}에게는 이 그래프가 보이지 않아요. 이 개형을 보고, ${EUN(YOU)} 무엇을 알아야 같은 그래프를 그릴 수 있을지 생각해 단서를 골라요.</p>
   <div class="gbox">${svgGraph(r,{curves:[{fn,col:'var(--good)'}],yb,yl:true,points:true,vlines:vl,cline:r.c!=null,w:720,h:230,aria:'우리가 알아낸 개형'})}</div>
   <p class="small" style="margin:8px 0 0">${flow.join(' → ')}</p><p class="small muted" style="margin:4px 0 0">처음 값 ${tl(r.dom[0])} ${v(F.fa)}${u} · 마지막 값 ${tl(r.dom[1])} ${v(F.fb)}${u}</p></div>`;}
function vPick(){const r=myCase(),cat=catalogue(r),ready=L.sent.length&&L.sent.every(id=>(L.reasons[id]||'').trim());
  return `<section class="panel"><div class="kicker" style="justify-content:space-between"><span>② ${ME} 단서 보내기</span><button class="btn sm" id="backAnalyze">← 풀이로 돌아가기</button></div>
  <h2>어떤 단서가 있어야 이 개형이 정해질까요? (단서 1~3개)</h2>
  <div class="box yel" style="margin-bottom:12px"><span class="small">${EUN(YOU)} 이 단서만 보고 개형을 그린 뒤, 그래프 4개 중 진짜를 골라 문제에 답해요. <b>보낸 단서만으로 진짜 그래프 하나만 남으면</b> 1개 +20 · 2개 +15 · 3개 +10, 후보가 2개 이상 남으면 0점이에요. 단서의 이유는 짝 모둠에게는 보이지 않고, 발표 때 선생님 화면에 나와요.</span></div>
  <div class="box" style="margin-bottom:12px"><span class="small" style="color:var(--an);font-weight:700">${r.num?'문제 '+r.num:'시범 문제'}</span> · <span class="small">${esc(r.text)}</span></div>
  ${DEMO?myShape(r)+ws('why','단서 고르기와 이유',`<b>생각 순서</b> ① 수학의 말 : [0, 6]에서 f(x)가 최댓값을 갖는 x ② 최댓값을 정하려면? → 극댓값과 양 끝값을 비교해야 해요 ③ 극댓값 161명이 양 끝값 33명, 105명보다 크니까, 극댓값 단서를 보내요.<br><b>이유</b> ${DEMO_WHY}<br><button class="btn sm navy" id="fillWhy" style="margin-top:6px">고른 단서에 이 이유 넣기</button>`):''}
  <div class="box yel" style="margin-bottom:6px"><b class="small">① 단서 고르기 → ② 활동지에 단서 내용을 먼저 직접 계산해 쓰기 → ③ 카드를 눌러 나온 "보낼 내용"과 같은지 확인 (다르면 활동지 고치기) → ④ 이유 쓰기</b></div>
  ${CGROUP.map(([g,t])=>{const cs=cat.filter(h=>h.g===g);return cs.length?`<h3 style="margin:12px 0 6px">${t}</h3><div class="hints">${cs.map(h=>`<button class="pickc" data-s="${h.id}" aria-pressed="${L.sent.includes(h.id)}"><b>${String(h.id).padStart(2,'0')}</b><span><strong>${esc(cardName(r,h.id))}</strong><small>${L.sent.includes(h.id)?'보낼 내용 : '+esc(h.answer):esc(h.prompt)}</small></span></button>`).join('')}</div>`:'';}).join('')}

    mine({stage:'sent',sent_cards:L.sent,card_reasons:reasons,exact,an_score:exact?SENT_PTS[L.sent.length]:0});go(DEMO?'recon':'wait');});
  const R=L.recon||{};
  on('openExtra','click',()=>keepY(()=>{R.openExtra=true;}));on('closeExtra','click',()=>keepY(()=>{R.openExtra=false;}));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>keepY(()=>{R.extra=+b.dataset.x;R.openExtra=false;}));
  document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>keepY(()=>{const id=b.dataset.out;R.out=R.out.includes(id)?R.out.filter(v=>v!==id):[...R.out,id];if(R.out.includes(R.cand))R.cand=null;}));
  document.querySelectorAll('[data-cand]').forEach(b=>b.onclick=()=>keepY(()=>{R.cand=b.dataset.cand;}));
  const ready=()=>{const s=$('submit');if(s)s.disabled=!(R.cand&&R.ans.a.trim()&&(theirCase().kind!=='iv'||R.ans.b.trim())&&R.why.trim());};
  on('aA','input',e=>{R.ans.a=e.target.value;save();ready();});on('aB','input',e=>{R.ans.b=e.target.value;save();ready();});on('why','input',e=>{R.why=e.target.value;save();ready();});
  on('submit','click',()=>{const r=theirCase(),graphOk=candidates(r).find(c=>c.id===R.cand)?.ans===true,aOk=ansOk(r,R.ans),gs=(graphOk?10:0)+(aOk?10:0)-(R.extra?5:0);
    L.reconRes={graphOk,ansOk:aOk,gs};const ansText=r.kind==='iv'?`${R.ans.a} ~ ${R.ans.b}`:R.ans.a;
    theirs({recon_stage:'done',extra_card:R.extra,eliminated:R.out,chosen:R.cand,answer:ansText,why:R.why,graph_ok:graphOk,ans_ok:aOk,gr_score:gs});go('result');});
  on('again','click',()=>{L=fresh('demo');render();window.scrollTo(0,0);});
  if(L.stage==='recon'&&!R.sketched)bindPad();
  on('file','change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>keepY(()=>{photo=fr.result;});fr.readAsDataURL(f);});
  on('up','click',async()=>{if(photoBusy||!photo)return;photoBusy=true;const b=$('up');b.disabled=true;b.textContent='올리는 중…';
    try{const blob=await shrinkImage(photo,1400);await api.upload(blob,{round_no:N,group_no:G,kind:'worksheet'});photo=null;await loadPhoto();toast('선생님 화면에 올렸어요');}
    catch(err){toast('올리지 못했어요: '+(err.message||err));}photoBusy=false;keepY(()=>{});});}
/* 새로고침해도 결정 화면에 받은 단서가 다시 보이도록 */
(async()=>{if(!DEMO&&L.stage!=='setup'){try{const me=await api.getRound(N,G);if(me===null){L={stage:'setup',case:null};save();}}catch(e){}}
  if(!DEMO&&(L.stage==='recon'||L.stage==='result')){try{partnerRow=await api.getRound(N,P);}catch(e){}if(!partnerRow||!caseById(partnerRow.case_id))L.stage='wait';}if(!DEMO&&L.stage!=='setup'&&!caseById(L.case))L={stage:'setup',case:null};await loadPhoto();render();})();
</script>
</body>
